<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 关节结构v4独立候选</title><style>body{margin:24px;background:#eef2f6;color:#20364a;font:16px system-ui}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}section{background:white;padding:12px;border-radius:10px}img{width:100%;height:560px;object-fit:contain}.warning{color:#984831}button,input{padding:8px;margin:5px}a{color:#216d91}</style><h1>05 · joint_structure_v4 独立审稿</h1><p class="warning">仅静态轴向网格/权重改动；原七件纹理、12骨setup与v3全部动画原值。保留失败，所有production/videoFit/prototype/wardrobe验收为false。</p><button id="play">播放</button><button id="prev">上一相位</button><button id="next">下一相位</button><input id="phase" type="range" min="0" max="31" value="0"><span id="label"></span><main><section><h2>源视频原始帧</h2><img id="source"></section><section><h2>旧v3基线</h2><img id="baseline"></section><section><h2>新v4候选</h2><img id="candidate"></section></main><p><a href="review_extremes.png">极限姿态</a> · <a href="review_transitions.png">相邻过渡</a> · <a href="topology_weights.png">近臂腿拓扑权重</a> · <a href="review.gif">完整三栏GIF</a> · <a href="checks.json">实测与视觉审阅</a> · <a href="provenance.json">来源改动范围</a> · <a href="protected_hashes.json">旧文件哈希</a></p><script>let i=0,on=false,last=0;const e=id=>document.getElementById(id);function draw(){e('source').src='reference/source_'+String(68+Math.floor(i/2)).padStart(3,'0')+'.png';for(const p of ['baseline','candidate'])e(p).src='renders/'+p+'_'+String(i).padStart(2,'0')+'.png';e('phase').value=i;e('label').textContent='相位 '+i+'/32 / f'+(68+i/2).toFixed(1)}e('phase').oninput=()=>{i=+e('phase').value;on=false;draw()};e('prev').onclick=()=>{i=(i+31)%32;draw()};e('next').onclick=()=>{i=(i+1)%32;draw()};e('play').onclick=()=>{on=!on;e('play').textContent=on?'暂停':'播放'};function step(t){if(on&&t-last>=1000/48){i=(i+1)%32;draw();last=t}requestAnimationFrame(step)}draw();requestAnimationFrame(step);</script></html>
