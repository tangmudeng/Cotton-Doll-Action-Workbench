<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pose Walk V3 独立审稿</title><style>body{font:15px system-ui;background:#edf1f5;color:#193149;margin:24px}h1{font-size:23px}main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:1500px}section{background:white;padding:12px;border-radius:8px}section img{width:100%;height:520px;object-fit:contain}section:first-child img{object-fit:contain;object-position:center}button,input{padding:8px;margin:5px}p{line-height:1.6}.warning{color:#9a4a30}a{color:#176985}small{display:block}</style><h1>Pose Walk V3 · 人工姿态候选</h1><p class="warning">仅独立审稿辅助，不是正式05入口。原视频只参考事件节奏；绑定/权重/图集冻结。所有验收标志 false。</p><button id="play">暂停</button><button id="prev">上一相位</button><button id="next">下一相位</button><input id="phase" type="range" min="0" max="31" step="1" value="0"><span id="label"></span><main><section><h2>源视频原始PNG</h2><img id="source" alt="源视频逐帧PNG"><small>同帧原始PNG，不加载外部网络；等比例显示裁剪副本，源文件保持不变</small></section><section><h2>导出角色</h2><img id="pose" alt="导出weighted mesh"></section><section><h2>角色与骨骼叠加</h2><img id="bones" alt="固定长度双骨链"></section></main><p><a href="review.png">查看完整姿态表</a> · <a href="review.gif">查看真实循环GIF</a> · <a href="reference/source.mp4">原始视频</a> · <a href="checks.json">实测检查</a> · <a href="motion-spec.json">人工动作说明</a></p><script>let i=0,playing=true,last=0;const source=document.getElementById('source'),pose=document.getElementById('pose'),bones=document.getElementById('bones'),phase=document.getElementById('phase'),label=document.getElementById('label'),play=document.getElementById('play');const cache=[];for(let j=0;j<32;j++){for(const p of ['pose','bones']){let im=new Image();im.src='renders/view_'+p+'_'+String(j).padStart(2,'0')+'.png';cache.push(im)}}function draw(){source.src='reference/view_'+String(68+Math.floor(i/2)).padStart(3,'0')+'.png';pose.src='renders/view_pose_'+String(i).padStart(2,'0')+'.png';bones.src='renders/view_bones_'+String(i).padStart(2,'0')+'.png';phase.value=i;label.textContent='相位 '+i+'/32 · 源帧 '+(68+Math.floor(i/2))+' · '+(i/48).toFixed(4)+'秒'}function pause(){playing=false;play.textContent='播放'}play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';last=performance.now()};document.getElementById('prev').onclick=()=>{pause();i=(i+31)%32;draw()};document.getElementById('next').onclick=()=>{pause();i=(i+1)%32;draw()};phase.oninput=()=>{pause();i=+phase.value;draw()};function tick(t){if(playing&&t-last>=1000/48){const steps=Math.floor((t-last)/(1000/48));i=(i+steps)%32;last+=steps*1000/48;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
