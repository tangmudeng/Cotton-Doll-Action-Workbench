<!doctype html><html lang="zh"><meta charset="utf-8"><title>原帧锁定基准 · IK对照</title><style>body{margin:0;background:#eef2f1;color:#263d3b;font:15px system-ui}main{max-width:1250px;margin:22px auto;padding:0 18px}article,.bar{background:white;border-radius:12px;padding:14px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.views{display:grid;grid-template-columns:1fr 1fr;gap:15px}canvas,img{width:100%;background:#f8faf8;border-radius:8px}button,input{font:inherit}input[type=range]{flex:1}.warn{border-left:4px solid #d79625;background:#fff7df;padding:10px;line-height:1.6}.muted{color:#607675}</style><main><h1>逐帧皮肤检查 · 原帧锁定基准</h1><div class="warn">右侧不是网格变形结果，而是同一源帧的原始皮肤轮廓，绑定到 root 的四边形；IK 骨架保留用于叠加参考。先用这页确认每一帧的原始美术，再与可变形皮肤版本比较。</div><div class="bar"><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><input id="seek" type="range" min="63" max="85" value="63"><strong id="label"></strong><label><input id="bones" type="checkbox">显示IK骨架</label></div><div class="views"><article><h2>原视频源帧</h2><img id="src"><p class="muted">视频原始像素</p></article><article><h2>原像素锁定附件</h2><canvas id="canvas" width="864" height="480"></canvas><p class="muted">同帧源像素，无网格拉伸；用于逐帧视觉基准</p></article></div><p><a href="../review.html">返回骨架标定</a> · <a href="reference_lock.spine">下载基准 Spine 工程</a> · <a href="manifest.json">附件来源</a></p><script src="runtime/spine-canvas.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),assets=new spine.AssetManager();await assets.loadJsonAsync('reference_lock.json');await assets.loadTextureAtlasAsync('reference.atlas');const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.get('reference.atlas'))).readSkeletonData(assets.get('reference_lock.json')),sk=new spine.Skeleton(data),anim=data.findAnimation('reference_cycle'),ctx=$('canvas').getContext('2d'),renderer=new spine.SkeletonRenderer(ctx);renderer.triangleRendering=true;let i=0,playing=true,last=performance.now();function draw(){let f=63+i,t=(f-63)/24;sk.setToSetupPose();anim.apply(sk,0,t,false,[],1,spine.MixBlend.replace,spine.MixDirection.mixIn);sk.updateWorldTransform(spine.Physics.update);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,864,480);ctx.fillStyle='#f8faf8';ctx.fillRect(0,0,864,480);ctx.setTransform(1,0,0,-1,432,480);renderer.draw(sk);if($('bones').checked){for(const b of sk.bones){if(b.data.name.endsWith('_target')){ctx.strokeStyle='#d94b89';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.worldX-5,b.worldY);ctx.lineTo(b.worldX+5,b.worldY);ctx.moveTo(b.worldX,b.worldY-5);ctx.lineTo(b.worldX,b.worldY+5);ctx.stroke()}else if(b.data.length){ctx.strokeStyle='#008d9a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.worldX,b.worldY);ctx.lineTo(b.worldX+b.a*b.data.length,b.worldY+b.c*b.data.length);ctx.stroke()}}}$('src').src='../../../frames/'+String(f).padStart(4,'0')+'.png';$('seek').value=f;$('label').textContent=f+'帧 · '+(f/24).toFixed(3)+'s'}function step(d){i=Math.max(0,Math.min(22,i+d));draw()}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('prev').onclick=()=>{playing=false;$('play').textContent='播放';step(-1)};$('next').onclick=()=>{playing=false;$('play').textContent='播放';step(1)};$('seek').oninput=()=>{playing=false;$('play').textContent='播放';i=+$('seek').value-63;draw()};function tick(t){if(playing&&t-last>42){i=(i+1)%23;last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)})()</script></main></html>
