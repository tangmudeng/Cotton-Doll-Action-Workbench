(async()=>{const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d'),assets=new spine.AssetManager();await assets.loadJsonAsync('skin.json');await assets.loadTextureAtlasAsync('skin.atlas');const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.get('skin.atlas'))).readSkeletonData(assets.get('skin.json')),sk=new spine.Skeleton(data),renderer=new spine.SkeletonRenderer(ctx);renderer.triangleRendering=true;renderer.drawTriangle=function(img,x0,y0,u0,v0,x1,y1,u1,v1,x2,y2,u2,v2){const c=this.ctx,W=img.width-1,H=img.height-1;u0*=W;u1*=W;u2*=W;v0*=H;v1*=H;v2*=H;const X1=x1-x0,Y1=y1-y0,X2=x2-x0,Y2=y2-y0,U1=u1-u0,V1=v1-v0,U2=u2-u0,V2=v2-v0,det=U1*V2-U2*V1;if(!det)return;const a=(V2*X1-V1*X2)/det,b=(V2*Y1-V1*Y2)/det,d=(U1*X2-U2*X1)/det,e=(U1*Y2-U2*Y1)/det,cx=(x0+x1+x2)/3,cy=(y0+y1+y2)/3;const pad=(x,y)=>{const len=Math.hypot(x-cx,y-cy);return [x+(x-cx)/len*.45,y+(y-cy)/len*.45]};c.save();c.beginPath();c.moveTo(...pad(x0,y0));c.lineTo(...pad(x1,y1));c.lineTo(...pad(x2,y2));c.closePath();c.clip();c.transform(a,b,d,e,x0-a*u0-d*v0,y0-b*u0-e*v0);c.drawImage(img,0,0);c.restore()};$('clearIK').onclick=()=>{$('dx').value=0;$('dy').value=0};$('target').onchange=()=>{const m=$('target').value.startsWith('leg')?4:5;for(const id of ['dx','dy']){$(id).min=-m;$(id).max=m;$(id).value=0}};let anim=data.findAnimation('reference_cycle');let t=0,playing=false,last=performance.now(),lastVideo=-1;let dur=anim.duration;$('status').textContent=`${data.bones.length} 根骨骼 · ${data.slots.length} 个部位 · 161 个姿态附件 · ${dur.toFixed(3)}s`;
