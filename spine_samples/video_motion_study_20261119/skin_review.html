<!doctype html><html lang="zh"><meta charset="utf-8"><title>原始帧素材检查（未绑定）</title><style>body{font:15px system-ui;background:#eef2f1;color:#243c3b;margin:24px}main{max-width:1200px;margin:auto}.bar,article{background:#fff;border-radius:12px;padding:14px;margin-bottom:15px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input{width:45%}.views{display:grid;grid-template-columns:1fr 1fr;gap:15px}canvas{width:100%;background:#f7faf9;border-radius:8px}small{color:#617675}.warn{border-left:4px solid #d38d24;background:#fff8df;padding:11px}.tag{color:#128275}</style><main><h1>右前行走 · 原始帧素材检查（未绑定）</h1><p class="warn">本页使用视频原始帧像素。没有生成式补画；透明区域来自边缘背景分离，原视频中被遮挡的像素仍然缺失。</p><div class="bar"><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><input id="seek" type="range" min="63" max="85" value="63"><strong id="label"></strong><label><input id="grid" type="checkbox">显示标注</label></div><div class="views"><article><h2>原视频帧</h2><canvas id="raw" width="864" height="480"></canvas><small>原始视频，未经裁切重绘</small></article><article><h2>原像素透明 cutout</h2><canvas id="cut" width="864" height="480"></canvas><small>源帧分离结果，作为后续附件候选</small></article></div><p class="tag">候选附件策略：同一部位采用不同姿态的原帧附件切换；无法观察的像素保持缺失，不补画。</p><p><a href="review.html">返回骨架标定</a> · <a href="source_pixel_animation.gif">播放原始像素循环</a> · <a href="motion_annotations.json">标注数据</a></p></main><script>
(async()=>{const $=id=>document.getElementById(id),data=await(await fetch('motion_annotations.json')).json();let i=0,playing=true,last=performance.now(),imgs={},cuts={};await Promise.all(data.samples.map(s=>new Promise(ok=>{let im=new Image();im.onload=()=>{imgs[s.frame]=im;let c=new Image();c.onload=()=>{cuts[s.frame]=c;ok()};c.src='source_cutouts/frame_'+String(s.frame).padStart(4,'0')+'.png'};im.src='frames/'+String(s.frame).padStart(4,'0')+'.png'})));function draw(){let s=data.samples[i],raw=$('raw').getContext('2d'),cut=$('cut').getContext('2d');raw.clearRect(0,0,864,480);cut.clearRect(0,0,864,480);raw.drawImage(imgs[s.frame],0,0);cut.fillStyle='#dfe9e7';cut.fillRect(0,0,864,480);cut.drawImage(cuts[s.frame],0,0);if($('grid').checked){for(const [n,p] of Object.entries(s.points)){raw.fillStyle=n.includes('far')?'#c96b35':'#078d9a';raw.beginPath();raw.arc(...p,4,0,7);raw.fill()} }$('label').textContent=s.frame+'帧 · '+(s.frame/24).toFixed(3)+'s';$('seek').value=s.frame}function play(v){playing=v;$('play').textContent=v?'暂停':'播放'}$('play').onclick=()=>play(!playing);$('prev').onclick=()=>{play(false);i=Math.max(0,i-1);draw()};$('next').onclick=()=>{play(false);i=Math.min(22,i+1);draw()};$('seek').oninput=()=>{play(false);i=+$('seek').value-63;draw()};function tick(t){if(playing&&t-last>42){i=(i+1)%23;last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)})();</script></html>
