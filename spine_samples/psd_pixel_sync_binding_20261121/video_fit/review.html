<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验收骨架 × PSD 绑定核对</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#263e33;font:15px system-ui}main{max-width:1200px;margin:18px auto;padding:0 20px}h1{font-size:25px;margin:10px 0}p{line-height:1.6}.notice{background:#e0edf1;padding:10px;border-radius:8px}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:13px 0}button,select{font:inherit;background:white;border:1px solid #a8b7ae;border-radius:6px;padding:7px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{padding:10px;background:white;border-radius:12px;min-width:0}h2{font-size:16px;margin:0 0 8px}canvas{display:block;height:min(55vh,640px);width:auto;max-width:100%;margin:auto;aspect-ratio:560/800;background:#ebebeb}#status{height:100px;overflow:auto;background:white;padding:10px;white-space:pre-wrap;font-size:13px}#clock{display:inline-block;width:215px;font-variant-numeric:tabular-nums}#seek{flex:1;min-width:200px}a{color:#136344}@media(max-width:700px){section{grid-template-columns:1fr}canvas{height:400px}}</style>
<main><h1>验收骨架 × PSD 绑定核对</h1><p>直接使用 pixel_sync_20261120 的 16 根骨骼、4 组 IK 和 reference_cycle 动画。整套骨架统一对齐 PSD，四肢附件在绑定姿势中对齐骨架，再进行网格权重绑定。</p><div class="notice">青色粗线：已验收骨架；红色细线：本工程实际回导骨架。两条线应逐帧重合。本轮审核重点是 PSD 蒙皮是否贴合，骨架等价不代表皮肤效果已获验收。</div>
<nav><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度 <select id="speed"><option value=".25">¼ 倍</option><option value=".5">½ 倍</option><option value="1" selected>正常</option></select></label><label><input type="checkbox" id="bones" checked>显示骨骼</label><label><input type="checkbox" id="overlay" checked>验收骨架叠加核对</label><label><input type="checkbox" id="detail">手脚局部</label><label><input type="checkbox" id="setup">绑定姿势</label></nav>
<section><article><h2>原视频 + 已验收骨架</h2><canvas id="source" width="560" height="800"></canvas></article><article><h2>新 PSD 蒙皮 + 同一套骨架</h2><canvas id="rig" width="560" height="800"></canvas></article></section>
<nav><input id="seek" aria-label="行走帧" type="range" min="0" max="22" step="1" value="0"><span id="clock"></span></nav><div id="status">加载中…</div><p><a href="../psd_bound_pixel_sync.zip">下载绑定修正工程</a> · <a href="contact_sheet.jpg">完整 23 帧</a> · <a href="README.md">绑定规则与修正说明</a></p></main>
<script src="runtime/spine-canvas.js"></script><script src="runtime/pixel-renderer.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),assets=new spine.AssetManager();await Promise.all([assets.loadJsonAsync('roundtrip/skin.json'),assets.loadJsonAsync('accepted_reference_bones.json'),assets.loadTextureAtlasAsync('skin.atlas')]);
const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.get('skin.atlas'))).readSkeletonData(assets.get('roundtrip/skin.json')),sk=new spine.Skeleton(data),refData=new spine.SkeletonJson(null).readSkeletonData(assets.get('accepted_reference_bones.json')),ref=new spine.Skeleton(refData),ctx=$('rig').getContext('2d'),renderer=new spine.SkeletonRenderer(ctx);renderer.triangleRendering=true;PixelTriangleRenderer(renderer);
const [keys,provenance,audit]=await Promise.all(['reference_times.json','provenance.json','technical_audit.json'].map(p=>fetch(p).then(r=>r.json()))),reg=provenance.registration;
const frames=await Promise.all(Array.from({length:23},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='reference_frames/'+String(63+i).padStart(4,'0')+'.png'})));let time=0,playing=false,last=performance.now();
function apply(s,d){s.setToSetupPose();if(!$('setup').checked)d.findAnimation('reference_cycle').apply(s,0,time,false,[],1,spine.MixBlend.replace,spine.MixDirection.mixIn);s.updateWorldTransform(spine.Physics.update)}
function lines(c,s,color,width,registered){c.save();if(registered){c.translate(...reg.offset);c.scale(reg.scale,reg.scale)}c.strokeStyle=color;c.fillStyle=color;c.lineWidth=width/(registered?reg.scale:1);for(const b of s.bones){if(b.data.length){c.globalAlpha=b.data.name.includes('_upper')||b.data.name.includes('_lower')?1:.3;c.beginPath();c.moveTo(b.worldX,b.worldY);c.lineTo(b.worldX+b.a*b.data.length,b.worldY+b.c*b.data.length);c.stroke()}if(b.data.name.endsWith('_target')){c.globalAlpha=1;c.beginPath();c.arc(b.worldX,b.worldY,4/(registered?reg.scale:1),0,2*Math.PI);c.fill()}}c.restore()}
function world(c,box){const z=Math.min(560/box[2],800/box[3]);c.translate((560-box[2]*z)/2,(800-box[3]*z)/2);c.scale(z,z);c.translate(512-box[0],1024-box[1]);c.scale(1,-1);return z}
function draw(){let frame=0;while(frame<22&&keys[frame+1]<=time+1e-8)frame++;const box=$('detail').checked?[350,570,360,340]:[230,110,560,800],c=$('source').getContext('2d'),z=Math.min(560/box[2],800/box[3]);apply(sk,data);apply(ref,refData);c.clearRect(0,0,560,800);c.save();c.translate((560-box[2]*z)/2,(800-box[3]*z)/2);c.scale(z,z);c.translate(-box[0],-box[1]);c.translate(536-449*reg.scale,582-289*reg.scale);c.scale(reg.scale,reg.scale);c.drawImage(frames[frame],0,0);c.restore();if($('bones').checked){c.save();world(c,box);lines(c,ref,'#009eb3',3/z,true);c.restore()}
ctx.clearRect(0,0,560,800);ctx.save();world(ctx,box);renderer.draw(sk);if($('bones').checked){if($('overlay').checked)lines(ctx,ref,'#00a8bb',6/z,true);lines(ctx,sk,'#dd4565',2/z,false)}ctx.restore();$('seek').value=frame;$('clock').textContent=`源帧 ${frame+63} / 85 · ${time.toFixed(3)} s`}
function pause(){playing=false;$('play').textContent='播放'}function step(n){pause();time=keys[(Number($('seek').value)+n+23)%23]+1e-6;draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('seek').oninput=()=>{pause();time=keys[+$('seek').value]+1e-6;draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};for(const id of ['bones','overlay','detail','setup'])$(id).onchange=draw;
$('status').textContent=`骨架核对：${audit.acceptedRigEquivalent?'一致':'不一致'}。16 骨 / 4 IK；层级、长度、弯曲方向、执行顺序和骨骼关键帧保留验收版。\n统一对齐后，回导骨架最大位置差 ${audit.roundtripPoseError.toExponential(2)} px；${audit.samples} 次采样；蒙皮翻折 ${audit.invertedTriangleObservations}。\n7 张新版 PSD 贴图，1 张图集。使用原验收版 24 fps 阶梯关键帧，没有添加逐帧换图或新的骨骼缩放轨道。`;
function tick(t){if(playing){time=(time+(t-last)/1000*+$('speed').value)%keys.at(-1);draw()}last=t;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)
})().catch(e=>document.getElementById('status').textContent='加载失败：'+e.message);
</script></html>
