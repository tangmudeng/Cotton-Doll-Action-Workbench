<main><h1>PSD 固定部件 · 右前行走试装</h1><p>外观使用《右前图层.psd》；动作取自已验收的右前行走第 63–85 帧骨架轨迹，再按 PSD 的比例与骨长重新拟合。</p><div class="notice">行走候选，尚未视觉验收。七张固定部件、四组双骨 IK；没有逐帧换图或补画。为保护宽厚手脚，弯曲量做了约束，尚未完成落脚阶段校正。</div>
<nav><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度 <select id="speed"><option value=".25">¼ 倍</option><option value=".5">½ 倍</option><option value="1" selected>正常</option></select></label><label><input type="checkbox" id="bones">显示骨骼 / IK</label><label><input type="checkbox" id="detail">手脚局部</label><label><input type="checkbox" id="setup">PSD 静态对照</label></nav>
<section><article><h2>AI 视频参考 · 同步源帧</h2><canvas id="source" width="560" height="800"></canvas></article><article><h2>PSD 稳定蒙皮 · Spine 实际回导数据</h2><canvas id="rig" width="560" height="800"></canvas></article></section>
<nav><input id="seek" aria-label="行走帧" type="range" min="0" max="22" step="1" value="0"><span id="clock"></span></nav><div id="status">加载中…</div><p><a href="../psd_walk_candidate.zip">下载 Spine 检查包</a> · <a href="contact_sheet.jpg">全部 23 帧总览</a> · <a href="README.md">说明与未完成项</a> · <a href="../review.html">原关节测试版</a></p></main>
<script src="runtime/spine-canvas.js"></script><script src="runtime/pixel-renderer.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),assets=new spine.AssetManager();await Promise.all([assets.loadJsonAsync('roundtrip/skin.json'),assets.loadTextureAtlasAsync('skin.atlas')]);const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.get('skin.atlas'))).readSkeletonData(assets.get('roundtrip/skin.json')),sk=new spine.Skeleton(data),ctx=$('rig').getContext('2d'),renderer=new spine.SkeletonRenderer(ctx);renderer.triangleRendering=true;PixelTriangleRenderer(renderer);
const frames=await Promise.all(Array.from({length:23},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='reference_frames/'+String(63+i).padStart(4,'0')+'.png'})));let time=0,playing=false,last=performance.now();
function draw(){const frame=Math.min(22,Math.floor(time*24+1e-6)),detail=$('detail').checked,box=detail?[350,560,360,350]:[230,110,560,800],ref=detail?[330,280,250,200]:[240,0,400,480],c=$('source').getContext('2d');c.clearRect(0,0,560,800);const z=Math.min(560/ref[2],800/ref[3]);c.drawImage(frames[frame],...ref,(560-ref[2]*z)/2,(800-ref[3]*z)/2,ref[2]*z,ref[3]*z);sk.setToSetupPose();if(!$('setup').checked)data.findAnimation('video_walk_fit').apply(sk,0,time,false,[],1,spine.MixBlend.replace,spine.MixDirection.mixIn);sk.updateWorldTransform(spine.Physics.update);ctx.clearRect(0,0,560,800);ctx.save();const scale=Math.min(560/box[2],800/box[3]);ctx.translate((560-box[2]*scale)/2,(800-box[3]*scale)/2);ctx.scale(scale,scale);ctx.translate(512-box[0],1024-box[1]);ctx.scale(1,-1);renderer.draw(sk);if($('bones').checked){ctx.strokeStyle='#087e94';ctx.fillStyle='#da592f';ctx.lineWidth=2/scale;for(const b of sk.bones){if(b.data.length){ctx.beginPath();ctx.moveTo(b.worldX,b.worldY);ctx.lineTo(b.worldX+b.a*b.data.length,b.worldY+b.c*b.data.length);ctx.stroke()}if(b.data.name.endsWith('_target')){ctx.beginPath();ctx.arc(b.worldX,b.worldY,4/scale,0,2*Math.PI);ctx.fill()}}}ctx.restore();$('seek').value=frame;$('clock').textContent=`源帧 ${frame+63} / 85 · ${time.toFixed(3)} s`}
function pause(){playing=false;$('play').textContent='播放'}function step(n){pause();time=((Math.round(time*24)+n+23)%23)/24;draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('seek').oninput=()=>{pause();time=+$('seek').value/24;draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};for(const id of ['bones','detail','setup'])$(id).onchange=draw;
const audit=await fetch('technical_audit.json').then(r=>r.json());$('status').textContent=`${audit.bones} 根骨骼 · 4 组双骨 IK · 7 个固定附件 · 1 张 1468 × 480 图集（RGBA 约 2.69 MiB）。\nSpine 回导：${audit.technicalPass?'技术检查通过':'未通过'}；${audit.samples} 次采样；顶点差 ${audit.maxRoundtripVertexDelta?.toFixed(4)} px；网格翻折 ${audit.invertedTriangleObservations}。\n重点查看裤口、远侧手和摆腿形体；技术通过不代表动作已获验收。`;
function tick(t){if(playing){time=(time+(t-last)/1000*+$('speed').value)%(23/24);draw()}last=t;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)
})().catch(e=>document.getElementById('status').textContent='加载失败：'+e.message);
</script></html>
