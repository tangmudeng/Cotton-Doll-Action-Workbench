<style>*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:#283d34;font:16px system-ui}main{max-width:1250px;margin:24px auto;padding:0 24px}h1{font-size:26px}p{line-height:1.7}.notice{padding:12px;background:#f6e8bf;border-radius:8px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}button,select{font:inherit;padding:8px;border:1px solid #9aafa3;border-radius:6px;background:white}section{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{background:white;border-radius:12px;padding:14px}h2{font-size:18px}canvas{display:block;width:100%;aspect-ratio:560/800;background:#dfe6e1}#status{height:100px;overflow:auto;background:white;padding:12px;white-space:pre-wrap}#clock{width:90px;display:inline-block;font-variant-numeric:tabular-nums}input[type=range]{width:65%}a{color:#126d4e}@media(max-width:750px){section{grid-template-columns:1fr}}</style>
<main><h1>PSD 母版 · 肩髋绑定小样</h1><p>使用你提供的《右前图层.psd》。保持原始图层位置与保留区域的 RGBA 像素；没有使用上一轮逐帧拆件或补画。</p><div class="notice">新版已接入双腿独立图层。当前检查肩臂、髋腿及脚底固定时的下沉；这些是关节活动测试，还不是视频行走。</div>
<nav><select id="anim" aria-label="测试动画"><option value="setup_hold">静态组装对照</option><option value="test_arm_near">近侧手臂活动</option><option value="test_arm_far">远侧手臂活动</option><option value="test_leg_near">近侧髋腿活动</option><option value="test_leg_far">远侧髋腿活动</option><option value="test_ground_contact">脚底固定 · 身体下沉</option></select><button id="play">播放</button><label><input id="bones" type="checkbox" checked>显示骨骼</label><label><input id="detail" type="checkbox">髋腿局部</label></nav>
<section><article><h2>PSD 原位置组装</h2><canvas id="source" width="560" height="800"></canvas></article><article><h2>Spine 网格与 IK</h2><canvas id="rig" width="560" height="800"></canvas></article></section><p><input id="seek" aria-label="动画时间" type="range" min="0" max="2" step=".01" value="0"><span id="clock"></span></p><div id="status">加载中…</div><p><a href="joint_probe.zip">下载完整肩髋检查包</a> · <a href="REPORT.md">素材检查与限制</a> · <a href="layer_detail.png">独立图层预览</a></p></main>
<script src="../../runtime/spine-canvas.js"></script><script src="../../studio_v3/pixel-renderer.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),assets=new spine.AssetManager();await Promise.all([assets.loadJsonAsync('rig/skin.json'),assets.loadTextureAtlasAsync('rig/skin.atlas')]);const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.get('rig/skin.atlas'))).readSkeletonData(assets.get('rig/skin.json')),sk=new spine.Skeleton(data),ctx=$('rig').getContext('2d'),renderer=new spine.SkeletonRenderer(ctx);renderer.triangleRendering=true;PixelTriangleRenderer(renderer);const source=new Image();await new Promise((resolve,reject)=>{source.onload=resolve;source.onerror=reject;source.src='rig/assembly.png'});let time=0,playing=false,last=performance.now();
function draw(){const detail=$('detail').checked,box=detail?[380,660,310,250]:[230,110,560,800],c=$('source').getContext('2d');c.clearRect(0,0,560,800);const sz=Math.min(560/box[2],800/box[3]);c.drawImage(source,...box,(560-box[2]*sz)/2,(800-box[3]*sz)/2,box[2]*sz,box[3]*sz);sk.setToSetupPose();data.findAnimation($('anim').value).apply(sk,0,time,false,[],1,spine.MixBlend.replace,spine.MixDirection.mixIn);sk.updateWorldTransform(spine.Physics.update);ctx.clearRect(0,0,560,800);ctx.save();const zoom=Math.min(560/box[2],800/box[3]),ox=(560-box[2]*zoom)/2,oy=(800-box[3]*zoom)/2;ctx.beginPath();ctx.rect(ox,oy,box[2]*zoom,box[3]*zoom);ctx.clip();ctx.translate(ox,oy);ctx.scale(zoom,zoom);ctx.translate(512-box[0],1024-box[1]);ctx.scale(1,-1);renderer.draw(sk);if($('bones').checked){ctx.strokeStyle='#0c8991';ctx.fillStyle='#d35535';ctx.lineWidth=2;for(const b of sk.bones){if(b.data.length){ctx.beginPath();ctx.moveTo(b.worldX,b.worldY);ctx.lineTo(b.worldX+b.a*b.data.length,b.worldY+b.c*b.data.length);ctx.stroke();}if(b.data.name.endsWith('_target')){ctx.beginPath();ctx.arc(b.worldX,b.worldY,4,0,2*Math.PI);ctx.fill();}}}ctx.restore();$('seek').value=time;$('clock').textContent=time.toFixed(2)+' s';}
$('anim').onchange=()=>{time=0;draw()};$('seek').oninput=()=>{playing=false;$('play').textContent='播放';time=+$('seek').value;draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('detail').onchange=draw;$('bones').onchange=draw;const audit=await fetch('rig/technical_audit.json').then(r=>r.json());$('status').textContent=`静态来源：7 个 PSD 图层；18 根骨骼（含两根脚掌控制）、4 组双骨 IK。\nSpine 回导最大顶点差 ${audit.maxRoundtripVertexDelta.toFixed(4)} px；${audit.checks} 次采样。\n需目视检查肩髋接合、裤口遮挡、脚底稳定和弯曲体积；技术检查不代表视觉验收。`;
function tick(t){if(playing){time=(time+(t-last)/1000)%2;draw()}last=t;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)})().catch(e=>document.getElementById('status').textContent='加载失败：'+e.message);
</script></html>
