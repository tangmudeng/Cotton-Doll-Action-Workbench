<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新版脚部 PSD · 行走修订对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#263e33;font:15px system-ui}main{max-width:1450px;margin:18px auto;padding:0 20px}h1{font-size:25px;margin:10px 0}p{line-height:1.6}.notice{background:#fff0c9;padding:10px;border-radius:8px}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:13px 0}button,select{font:inherit;background:white;border:1px solid #a8b7ae;border-radius:6px;padding:7px}section{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}article{padding:10px;background:white;border-radius:12px;min-width:0}h2{font-size:16px;margin:0 0 8px}canvas{display:block;height:min(55vh,640px);width:auto;max-width:100%;margin:auto;aspect-ratio:560/800;background:#ebebeb}#status{height:86px;overflow:auto;background:white;padding:10px;white-space:pre-wrap;font-size:13px}#clock{display:inline-block;width:215px;font-variant-numeric:tabular-nums}#seek{flex:1;min-width:200px}a{color:#136344}@media(max-width:800px){section{grid-template-columns:1fr}canvas{height:400px}}</style>
<main><h1>新版脚部 PSD · 行走修订对照</h1><p>三个画面使用同一时间点。左侧原视频按颈部和整体比例对齐；中间保留上轮候选；右侧使用本次更新的双脚图层。仅对照用的旧素材不进入新 Spine 工程。</p><div class="notice">本轮恢复手脚前后轨迹与透视缩短，加入胯部、裤衩联动和脚掌转动。仍需视觉审核；不是换新视频即可自动合格的生产流程。</div>
<nav><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度 <select id="speed"><option value=".25">¼ 倍</option><option value=".5">½ 倍</option><option value="1" selected>正常</option></select></label><label><input type="checkbox" id="bones">骨骼 / IK</label><label><input type="checkbox" id="detail">手脚局部</label><label><input type="checkbox" id="setup">新版 PSD 静态对照</label></nav>
<section><article><h2>AI 视频 · 原始参考</h2><canvas id="source" width="560" height="800"></canvas></article><article><h2>上轮候选 · 修改前</h2><canvas id="old" width="560" height="800"></canvas></article><article><h2>本轮修订 · 新 PSD / 新动作</h2><canvas id="rig" width="560" height="800"></canvas></article></section>
<nav><input id="seek" aria-label="行走帧" type="range" min="0" max="22" step="1" value="0"><span id="clock"></span></nav><div id="status">加载中…</div><p><a href="../psd_walk_updated_feet.zip">下载新版 Spine 工程</a> · <a href="contact_sheet.jpg">新版 23 帧总览</a> · <a href="comparison.jpg">代表姿势新旧对照</a> · <a href="README.md">修改说明与限制</a></p></main>
<script src="runtime/spine-canvas.js"></script><script src="runtime/pixel-renderer.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),assets=new spine.AssetManager();await Promise.all(['roundtrip/skin.json','previous/skin.json'].map(p=>assets.loadJsonAsync(p)).concat(['skin.atlas','previous/skin.atlas'].map(p=>assets.loadTextureAtlasAsync(p))));
function rig(file,atlas,canvas){const data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.get(atlas))).readSkeletonData(assets.get(file)),sk=new spine.Skeleton(data),ctx=$(canvas).getContext('2d'),renderer=new spine.SkeletonRenderer(ctx);renderer.triangleRendering=true;PixelTriangleRenderer(renderer);return{data,sk,ctx,renderer}}
const current=rig('roundtrip/skin.json','skin.atlas','rig'),previous=rig('previous/skin.json','previous/skin.atlas','old');
const frames=await Promise.all(Array.from({length:23},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='reference_frames/'+String(63+i).padStart(4,'0')+'.png'})));let time=0,playing=false,last=performance.now();
function pose(r,box,staticPose){const{sk,data,ctx,renderer}=r;sk.setToSetupPose();if(!staticPose)data.findAnimation('video_walk_fit').apply(sk,0,time,false,[],1,spine.MixBlend.replace,spine.MixDirection.mixIn);sk.updateWorldTransform(spine.Physics.update);ctx.clearRect(0,0,560,800);ctx.save();const scale=Math.min(560/box[2],800/box[3]);ctx.translate((560-box[2]*scale)/2,(800-box[3]*scale)/2);ctx.scale(scale,scale);ctx.translate(512-box[0],1024-box[1]);ctx.scale(1,-1);renderer.draw(sk);if($('bones').checked){ctx.strokeStyle='#087e94';ctx.fillStyle='#da592f';ctx.lineWidth=2/scale;for(const b of sk.bones){if(b.data.length){ctx.beginPath();ctx.moveTo(b.worldX,b.worldY);ctx.lineTo(b.worldX+b.a*b.data.length,b.worldY+b.c*b.data.length);ctx.stroke()}if(b.data.name.endsWith('_target')){ctx.beginPath();ctx.arc(b.worldX,b.worldY,4/scale,0,2*Math.PI);ctx.fill()}}}ctx.restore()}
function draw(){const frame=Math.min(22,Math.floor(time*24+1e-6)),box=$('detail').checked?[350,570,360,340]:[230,110,560,800],c=$('source').getContext('2d'),zoom=Math.min(560/box[2],800/box[3]);c.clearRect(0,0,560,800);c.save();c.translate((560-box[2]*zoom)/2,(800-box[3]*zoom)/2);c.scale(zoom,zoom);c.translate(-box[0],-box[1]);c.translate(536-449*1.68,582-289*1.68);c.scale(1.68,1.68);c.drawImage(frames[frame],0,0);c.restore();pose(previous,box,false);pose(current,box,$('setup').checked);$('seek').value=frame;$('clock').textContent=`源帧 ${frame+63} / 85 · ${time.toFixed(3)} s`}
function pause(){playing=false;$('play').textContent='播放'}function step(n){pause();time=((Math.round(time*24)+n+23)%23)/24;draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('seek').oninput=()=>{pause();time=+$('seek').value/24;draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};for(const id of ['bones','detail','setup'])$(id).onchange=draw;
const audit=await fetch('technical_audit.json').then(r=>r.json());$('status').textContent=`18 根骨骼 · 4 组双骨 IK · 7 个固定附件 · 1 张 1460 × 480 图集（RGBA 约 2.67 MiB）。\n实际 Spine 回导 ${audit.technicalPass?'技术检查通过':'未通过'}；${audit.samples} 次采样；顶点差 ${audit.maxRoundtripVertexDelta?.toFixed(4)} px；翻折 ${audit.invertedTriangleObservations}。\n透视变化使用显式骨骼缩放，腿根与裤衩使用过渡权重；请重点判断动态是否自然，尚未通过最终验收。`;
function tick(t){if(playing){time=(time+(t-last)/1000*+$('speed').value)%(23/24);draw()}last=t;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick)
})().catch(e=>document.getElementById('status').textContent='加载失败：'+e.message);
</script></html>
